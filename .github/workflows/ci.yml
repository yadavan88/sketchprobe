name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: sbt test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt --batch scalafmtCheckAll
      - name: Test
        run: sbt --batch test
